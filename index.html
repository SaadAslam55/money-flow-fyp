    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Money Flow - Business Management Platform" />
    <meta property="og:site_name" content="Money Flow" />
    <meta property="og:locale" content="en_US" />

    <!-- ============================================================================
         Apple Mobile Web App

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ============================================================================
         Performance Optimizations
         ============================================================================ -->
    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.stripe.com" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://cdn.mixpanel.com" />

    <!-- ============================================================================
         Analytics Scripts (Load Early)
         ============================================================================ -->
    <!-- Mixpanel: No stub needed - analytics service will handle initialization -->
    <!-- Removing the stub prevents any potential initialization conflicts -->

    <!-- ============================================================================
         Security Headers
         Note: These should ideally be set at the server level (nginx, Apache, etc.)
         Meta tags are a fallback but server headers take precedence.
         
         IMPORTANT: X-Frame-Options cannot be set via meta tag - it must be set via HTTP header.
         Remove the X-Frame-Options meta tag and configure it at the server level.
         ============================================================================ -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options removed: Must be set via HTTP header, not meta tag -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    <!-- Content-Security-Policy should be set at server level for better security -->

  </head>
  <body>
    <!-- ============================================================================
         NoScript Fallback
         ============================================================================ -->
    <noscript>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          padding: 20px;
          text-align: center;
          font-family:
            -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
            sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
        "
      >
        <div
          style="
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
          "
        >
          <h1 style="font-size: 2rem; margin-bottom: 1rem; font-weight: 700">
            JavaScript Required
          </h1>
          <p style="font-size: 1.1rem; margin-bottom: 1.5rem; line-height: 1.6; opacity: 0.9">
            Money Flow is a modern web application that requires JavaScript to function properly.
          </p>
          <p style="font-size: 1rem; margin-bottom: 2rem; line-height: 1.6; opacity: 0.8">
            Please enable JavaScript in your browser settings to continue. If you need assistance,
            please contact our support team.
          </p>
          <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap">
            <a
              href="https://www.enable-javascript.com/"
              target="_blank"
              rel="noopener noreferrer"
              style="
                padding: 12px 24px;
                background: white;
                color: #667eea;
                text-decoration: none;
                border-radius: 6px;
                font-weight: 600;
                transition: transform 0.2s;
              "
              onmouseover="this.style.transform='scale(1.05)'"
              onmouseout="this.style.transform='scale(1)'"
            >
              How to Enable JavaScript
            </a>
            <a
              href="mailto:support@moneyflow.com"
              style="
                padding: 12px 24px;
                background: rgba(255, 255, 255, 0.2);
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-weight: 600;
                border: 2px solid white;
                transition: background 0.2s;
              "
              onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'"
              onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'"
            >
              Contact Support
            </a>
          </div>
        </div>
      </div>
    </noscript>
