name = "moneyflow-edge"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account settings (update with your account)
# account_id = "your-account-id"

# Environment variables
[vars]
ENVIRONMENT = "production"
API_ORIGIN = "https://your-nestjs-api.render.com"

# KV Namespaces (update IDs after creation)
# Run: wrangler kv:namespace create "CACHE"
[[kv_namespaces]]
binding = "CACHE"
id = "your-cache-kv-id"
preview_id = "your-cache-preview-kv-id"

# Run: wrangler kv:namespace create "RATE_LIMIT"
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "your-rate-limit-kv-id"
preview_id = "your-rate-limit-preview-kv-id"

# Run: wrangler kv:namespace create "SESSIONS"
[[kv_namespaces]]
binding = "SESSIONS"
id = "your-sessions-kv-id"
preview_id = "your-sessions-preview-kv-id"

# Secrets (set via wrangler secret put <name>)
# - SUPABASE_URL
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - API_SECRET

# Custom domain routes (update with your domain)
# [[routes]]
# pattern = "api.mtkcodex.site/*"
# zone_name = "mtkcodex.site"

# Development environment
[env.development]
name = "moneyflow-edge-dev"
[env.development.vars]
ENVIRONMENT = "development"
API_ORIGIN = "http://localhost:3001"

# Staging environment
[env.staging]
name = "moneyflow-edge-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
API_ORIGIN = "https://staging-api.render.com"

# Build configuration
[build]
command = ""

# Observability
[observability]
enabled = true

# Limits
[limits]
cpu_ms = 50
